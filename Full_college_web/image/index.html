<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Enrollment Form</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

</head>

<body>

    <!--==========================
            HEADER
    ===========================-->

    <header class="top-header">

        <div class="overlay"></div>

        <div class="header-container">

            <div class="logo">

                <img src="logo.jpeg" alt="College Logo">

            </div>

            <div class="college-info">

                <h1>BABU SUNDER SINGH DEGREE COLLEGE</h1>

                <h3>Affiliated to Lucknow University</h3>

                <p>Empowering Education, Enriching Future</p>

            </div>

        </div>

    </header>

    <!--==========================
            MAIN FORM
    ===========================-->

    <section class="main-section">

        <div class="form-card">

            <div class="form-title">

                <i class="fa-solid fa-graduation-cap"></i>

                <h2>STUDENT ENROLLMENT FORM</h2>

            </div>

            <!--==========================
                PERSONAL INFORMATION
            ===========================-->

            <div class="section-title">
                1. Personal Information
            </div>

            <form action="/rjuikn5">

                <div class="form-grid">

                    <!-- Full Name -->

                    <div class="form-group">

                        <label>
                            Full Name of Student
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter full name" name="">

                    </div>

                    <!-- Father -->

                    <div class="form-group">

                        <label>
                            Father's Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter father's name">

                    </div>

                    <!-- Mother -->

                    <div class="form-group">

                        <label>
                            Mother's Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter mother's name">

                    </div>

                    <!-- DOB -->

                    <div class="form-group">

                        <label>
                            Date of Birth
                            <span>*</span>
                        </label>

                        <input type="date">

                    </div>

                    <!-- Gender -->

                    <div class="form-group">

                        <label>
                            Gender
                            <span>*</span>
                        </label>

                        <div class="gender">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    checked>
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender">
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender">
                                Other
                            </label>

                        </div>

                    </div>

                    <!-- Aadhaar -->

                    <div class="form-group">

                        <label>
                            Aadhaar Number
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            maxlength="12"
                            placeholder="Enter Aadhaar Number">

                    </div>

                    <!-- Mobile -->

                    <div class="form-group">

                        <label>
                            Mobile Number
                            <span>*</span>
                        </label>

                        <input
                            type="tel"
                            placeholder="Enter Mobile Number">

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label>
                            Email ID
                            <span>*</span>
                        </label>

                        <input
                            type="email"
                            placeholder="Enter Email ID">

                    </div>

                    <!-- Nationality -->

                    <div class="form-group">

                        <label>
                            Nationality
                            <span>*</span>
                        </label>

                        <select>

                            <option>Indian</option>

                            <option>Nepali</option>

                            <option>Bhutanese</option>

                            <option>Other</option>

                        </select>

                    </div>

                </div>

                <!-- Address -->

                <div class="form-group address-box">

                    <label>
                        Address
                        <span>*</span>
                    </label>

                    <textarea
                        rows="4"
                        placeholder="Enter Complete Address"></textarea>

                </div>

                <!-- Bottom Grid -->

                <div class="form-grid">

                    <!-- City -->

                    <div class="form-group">

                        <label>
                            City
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter City">

                    </div>

                    <!-- State -->

                    <div class="form-group">

                        <label>
                            State
                            <span>*</span>
                        </label>

                        <select>

                            <option>Select State</option>

                            <option>Uttar Pradesh</option>

                            <option>Bihar</option>

                            <option>Delhi</option>

                            <option>Punjab</option>

                            <option>Haryana</option>

                            <option>Maharashtra</option>

                        </select>

                    </div>

                    <!-- PIN -->

                    <div class="form-group">

                        <label>
                            PIN Code
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter PIN Code">

                    </div>

                </div>

                <!-- Academic Information starts here in Part 2 -->
                                 <!--==========================
                    2. Academic Information
                ==========================-->

                <div class="section-title">
                    2. Academic Information
                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Course Applied For <span>*</span></label>

                        <select>
                            <option>Select Course</option>
                            <option>BCA</option>
                            <option>BBA</option>
                            <option>BA</option>
                            <option>B.Com</option>
                            <option>B.Sc</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Qualification <span>*</span></label>

                        <select>
                            <option>Select Qualification</option>
                            <option>High School</option>
                            <option>Intermediate</option>
                            <option>Graduate</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Passing Year <span>*</span></label>

                        <select>
                            <option>Select Year</option>
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>2023</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>School / College Name <span>*</span></label>

                        <input
                            type="text"
                            placeholder="Enter School / College Name">
                    </div>

                    <div class="form-group">
                        <label>Board / University <span>*</span></label>

                        <input
                            type="text"
                            placeholder="Enter Board / University">
                    </div>

                    <div class="form-group">
                        <label>Percentage / CGPA <span>*</span></label>

                        <input
                            type="text"
                            placeholder="Enter Percentage / CGPA">
                    </div>

                </div>

                <!--==========================
                    Upload Documents
                ==========================-->

                <div class="section-title">
                    3. Upload Documents
                </div>

                <div class="upload-grid">

                    <div class="upload-box">

                        <label>Photo <span>*</span></label>

                        <div class="upload-card">

                            <i class="fa-solid fa-user"></i>

                            <input type="file">

                        </div>

                    </div>

                    <div class="upload-box">

                        <label>Aadhaar Card <span>*</span></label>

                        <div class="upload-card">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <input type="file">

                        </div>

                    </div>

                    <div class="upload-box">

                        <label>10th Marksheet <span>*</span></label>

                        <div class="upload-card">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <input type="file">

                        </div>

                    </div>

                    <div class="upload-box">

                        <label>12th Marksheet <span>*</span></label>

                        <div class="upload-card">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <input type="file">

                        </div>

                    </div>

                    <div class="upload-box">

                        <label>Transfer Certificate</label>

                        <div class="upload-card">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <input type="file">

                        </div>

                    </div>

                    <div class="upload-box">

                        <label>Character Certificate</label>

                        <div class="upload-card">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <input type="file">

                        </div>

                    </div>

                </div>

                <!--==========================
                    Declaration
                ==========================-->

                <div class="section-title">
                    4. Declaration
                </div>

                <div class="declaration">

                    <label>

                        <input type="checkbox">

                        I hereby declare that the information provided above is true to the best of my knowledge and belief.

                    </label>

                    <p>

                        I understand that any false information may lead to cancellation of my admission.

                    </p>

                </div>

                <!--==========================
                    Signature Area
                ==========================-->

                <div class="form-grid signature-grid">

                    <div class="form-group">

                        <label>Date</label>

                        <input type="date">

                    </div>

                    <div class="form-group">

                        <label>Student Signature</label>

                        <input
                            type="text"
                            placeholder="Sign Here">

                    </div>

                    <div class="form-group">

                        <label>Parent / Guardian Signature</label>

                        <input
                            type="text"
                            placeholder="Sign Here">

                    </div>

                </div>

                <!-- Submit -->

                <div class="submit-area">

                    <button
                        type="submit"
                        class="submit-btn">

                        <i class="fa-solid fa-paper-plane"></i>

                        Submit Enrollment Form

                    </button>

                </div>

            </form>

        </div>

    </section>

</body>

</html>
